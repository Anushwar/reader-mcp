[project]
name = "reader-mcp"
version = "0.1.0"
description = "MCP server that turns PDF, DOCX, CSV and text files into searchable text and metadata for any AI agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Anushwar" }]
keywords = ["mcp", "model-context-protocol", "pdf", "docx", "csv", "document", "llm", "agents"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.13",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.scripts]
reader = "reader_mcp.cli:main"

[project.urls]
Repository = "https://github.com/Anushwar/reader-mcp"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
